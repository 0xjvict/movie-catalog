services:
  # BACKEND APP Laravel
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        USER_ID: $UID
        GROUP_ID: $GID
    container_name: movie_catalog_app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      SSL_MODE: "off"
      AUTORUN_ENABLED: "true"
    networks:
      - movie_catalog_network
    depends_on:
      mysql:
        condition: service_healthy

  # MYSQL
  mysql:
    image: mysql:8.0
    container_name: movie_catalog_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-movie_catalog_db}
      MYSQL_USER: ${DB_USERNAME:-movie_catalog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-movie_catalog_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-movie_catalog_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - movie_catalog_network
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FRONTEND Vue + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: movie_catalog_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
      - VITE_API_URL_INTERNAL=http://app:80/api
      - VITE_APP_NAME=Movie Catalog
      - VITE_APP_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - movie_catalog_network
    depends_on:
      - app
    stdin_open: true
    tty: true

volumes:
  mysql_data:
    driver: local
  php_vendor:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  movie_catalog_network:
    driver: bridge